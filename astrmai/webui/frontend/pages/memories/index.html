<div id="page-memory" x-show="currentPage === 'memories'" x-data="memoryPage()" x-cloak class="pb-10 flex flex-col h-full">
    
    <!-- Header -->
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">鍥涚淮璁板繂缃戠粶 (Memories)</h2>
            <p class="text-slate-400">绠＄悊 AI 鐨勮蹇嗙鐗囥€佸弽鎬濇棩蹇椼€佸疄浣撳浘璋变笌榛戣瘽瀛楀吀</p>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="glass-panel p-1.5 flex gap-1 rounded-lg">
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="currentTab === 'canonical' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="setTab('canonical')">Canonical</button>
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="currentTab === 'diagnostics' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="setTab('diagnostics')">Diagnostics</button>
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="currentTab === 'events' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="setTab('events')">璁板繂纰庣墖 (Events)</button>
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="currentTab === 'reflections' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="setTab('reflections')">姣忔棩鍙嶆€?(Reflections)</button>
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="currentTab === 'nodes' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="setTab('nodes')">瀹炰綋鍥捐氨 (Nodes)</button>
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="currentTab === 'jargon' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="setTab('jargon')">榛戣瘽瀛楀吀 (Jargon)</button>
        </div>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-brand-500"></i>
        <p>姝ｅ湪璇诲彇绁炵粡缃戠粶灞?..</p>
    </div>

    <div x-show="!loading" class="flex-1">
        
        <!-- CANONICAL MEMORY TAB -->
        <template x-if="currentTab === 'canonical'">
            <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_420px] gap-6">
                <div class="flex flex-col gap-4">
                    <div class="glass-panel p-4 grid grid-cols-1 md:grid-cols-5 gap-3">
                        <input class="form-input" placeholder="session_id" x-model="canonicalFilters.session_id" @change="loadCanonical()">
                        <input class="form-input" placeholder="persona_id" x-model="canonicalFilters.persona_id" @change="loadCanonical()">
                        <input class="form-input" placeholder="kind" x-model="canonicalFilters.kind" @change="loadCanonical()">
                        <select class="form-input" x-model="canonicalFilters.status" @change="loadCanonical()">
                            <option value="">all status</option>
                            <option value="active">active</option>
                            <option value="stale">stale</option>
                            <option value="deleted">deleted</option>
                            <option value="merged">merged</option>
                        </select>
                        <button class="glass-btn px-4 py-2 text-sm" @click="loadCanonical()">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="glass-panel overflow-hidden">
                        <div class="px-5 py-3 border-b border-white/10 flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-100">Canonical Memory</h3>
                                <p class="text-xs text-slate-500" x-text="`${canonical.total || 0} records`"></p>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="border-b border-white/10 text-slate-400 text-sm bg-slate-800/50">
                                        <th class="px-5 py-3">Memory</th>
                                        <th class="px-5 py-3 whitespace-nowrap">Kind</th>
                                        <th class="px-5 py-3 whitespace-nowrap">Status</th>
                                        <th class="px-5 py-3 whitespace-nowrap">Weight</th>
                                    </tr>
                                </thead>
                                <tbody class="text-sm text-slate-300">
                                    <template x-for="item in canonical.items" :key="item.id">
                                        <tr class="border-b border-white/5 hover:bg-slate-800/40 cursor-pointer"
                                            :class="selectedCanonical && selectedCanonical.id === item.id ? 'bg-brand-500/10' : ''"
                                            @click="loadCanonicalDetail(item.id)">
                                            <td class="px-5 py-4">
                                                <div class="font-mono text-xs text-brand-300" x-text="item.id"></div>
                                                <div class="mt-1 line-clamp-2" x-text="item.summary || item.content"></div>
                                                <div class="mt-1 text-xs text-slate-500" x-text="item.session_id || 'global'"></div>
                                            </td>
                                            <td class="px-5 py-4 whitespace-nowrap" x-text="item.kind"></td>
                                            <td class="px-5 py-4 whitespace-nowrap">
                                                <span class="px-2 py-1 rounded text-xs border"
                                                      :class="item.status === 'active' ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300' : (item.status === 'stale' ? 'bg-amber-500/15 border-amber-500/30 text-amber-300' : 'bg-slate-800 border-slate-600 text-slate-300')"
                                                      x-text="item.status"></span>
                                            </td>
                                            <td class="px-5 py-4 whitespace-nowrap">
                                                <span x-text="Number(item.importance || 0).toFixed(2)"></span>
                                                <span class="text-slate-500"> / </span>
                                                <span x-text="Number(item.confidence || 0).toFixed(2)"></span>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="!canonical.items || !canonical.items.length">
                                        <tr><td colspan="4" class="p-8 text-center text-slate-500">No canonical memory records.</td></tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <aside class="glass-panel p-5 h-max sticky top-4" x-show="selectedCanonical">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div>
                            <h3 class="font-bold text-slate-100">Memory Detail</h3>
                            <p class="font-mono text-xs text-brand-300 break-all" x-text="selectedCanonical && selectedCanonical.id"></p>
                        </div>
                        <span class="px-2 py-1 rounded text-xs bg-slate-800 text-slate-300" x-text="selectedCanonical && selectedCanonical.visibility"></span>
                    </div>
                    <div class="space-y-4 text-sm">
                        <div>
                            <div class="text-xs uppercase text-slate-500 mb-1">Summary</div>
                            <p class="text-slate-200 leading-relaxed" x-text="selectedCanonical && selectedCanonical.summary"></p>
                        </div>
                        <div>
                            <div class="text-xs uppercase text-slate-500 mb-1">Content</div>
                            <p class="text-slate-300 whitespace-pre-wrap leading-relaxed max-h-56 overflow-auto" x-text="selectedCanonical && selectedCanonical.content"></p>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-xs">
                            <div><span class="text-slate-500">source</span><div x-text="selectedCanonical && selectedCanonical.source"></div></div>
                            <div><span class="text-slate-500">kind</span><div x-text="selectedCanonical && selectedCanonical.kind"></div></div>
                            <div><span class="text-slate-500">updated</span><div x-text="formatDate(selectedCanonical && selectedCanonical.updated_at)"></div></div>
                            <div><span class="text-slate-500">last access</span><div x-text="formatDate(selectedCanonical && selectedCanonical.last_access_time)"></div></div>
                        </div>
                        <pre class="text-xs bg-slate-950/70 border border-white/10 rounded p-3 max-h-48 overflow-auto" x-text="formatJson(selectedCanonical && selectedCanonical.metadata)"></pre>
                        <div class="flex flex-wrap gap-2 pt-2">
                            <button class="glass-btn px-3 py-2 text-xs" @click="restoreCanonical(selectedCanonical.id)">Restore</button>
                            <button class="glass-btn px-3 py-2 text-xs" @click="markCanonicalStale(selectedCanonical.id)">Mark stale</button>
                            <button class="glass-btn px-3 py-2 text-xs text-rose-300" @click="softDeleteCanonical(selectedCanonical.id)">Soft delete</button>
                        </div>
                        <div class="flex gap-2">
                            <input class="form-input flex-1" placeholder="target memory id" x-model="mergeTargetId">
                            <button class="glass-btn px-3 py-2 text-xs" @click="mergeCanonical(selectedCanonical.id)">Merge</button>
                        </div>
                    </div>
                </aside>
            </div>
        </template>

        <!-- MEMORY DIAGNOSTICS TAB -->
        <template x-if="currentTab === 'diagnostics'">
            <div class="flex flex-col gap-6">
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                    <div class="glass-panel p-4">
                        <div class="text-xs uppercase text-slate-500 mb-1">Instant Gate</div>
                        <div class="text-lg font-bold text-slate-100" x-text="observabilityRuntime && observabilityRuntime.instant_gate_ready ? 'Ready' : 'Offline'"></div>
                        <div class="text-xs text-slate-400 mt-2" x-text="`Last hit: ${formatDate((observabilityRuntime && observabilityRuntime.observer_status && observabilityRuntime.observer_status.last_gate_hit_at) || 0)}`"></div>
                    </div>
                    <div class="glass-panel p-4">
                        <div class="text-xs uppercase text-slate-500 mb-1">Memory Pipeline</div>
                        <div class="text-lg font-bold text-slate-100" x-text="observabilityRuntime && observabilityRuntime.memory_pipeline_ready ? 'Ready' : 'Offline'"></div>
                        <div class="text-xs text-slate-400 mt-2" x-text="`Workers: ${(observabilityRuntime && observabilityRuntime.memory_pipeline_status && observabilityRuntime.memory_pipeline_status.active_worker_count) || 0}`"></div>
                    </div>
                    <div class="glass-panel p-4">
                        <div class="text-xs uppercase text-slate-500 mb-1">Session Summarizer</div>
                        <div class="text-lg font-bold text-slate-100" x-text="observabilityRuntime && observabilityRuntime.session_summarizer_ready ? 'Ready' : 'Offline'"></div>
                        <div class="text-xs text-slate-400 mt-2" x-text="`Last success: ${formatDate((observabilityRuntime && observabilityRuntime.observer_status && observabilityRuntime.observer_status.last_summarize_success_at) || 0)}`"></div>
                    </div>
                    <div class="glass-panel p-4">
                        <div class="text-xs uppercase text-slate-500 mb-1">Errors / Warnings</div>
                        <div class="text-lg font-bold text-slate-100">
                            <span x-text="(observabilityRuntime && observabilityRuntime.observer_status && observabilityRuntime.observer_status.recent_error_count) || 0"></span>
                            <span class="text-slate-500 mx-1">/</span>
                            <span x-text="(observabilityRuntime && observabilityRuntime.observer_status && observabilityRuntime.observer_status.recent_warning_count) || 0"></span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <div class="glass-panel p-5">
                    <h3 class="font-bold text-slate-100 mb-4">Migration</h3>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button class="glass-btn px-3 py-2 text-xs" @click="runMigrationDryRun()">Dry run</button>
                        <button class="glass-btn px-3 py-2 text-xs" @click="runMigrationExecute()">Execute</button>
                        <button class="glass-btn px-3 py-2 text-xs" @click="runMigrationVerify()">Verify</button>
                        <button class="glass-btn px-3 py-2 text-xs" @click="runMigrationRepair()">Repair</button>
                    </div>
                    <pre class="text-xs bg-slate-950/70 border border-white/10 rounded p-3 max-h-[460px] overflow-auto" x-text="formatJson(migrationReport)"></pre>
                </div>
                <div class="glass-panel p-5">
                    <h3 class="font-bold text-slate-100 mb-4">Index Projection</h3>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button class="glass-btn px-3 py-2 text-xs" @click="loadDiagnostics()">Refresh</button>
                        <button class="glass-btn px-3 py-2 text-xs" @click="rebuildIndex()">Rebuild all</button>
                        <button class="glass-btn px-3 py-2 text-xs" @click="runMigrationRepair()">Repair</button>
                    </div>
                    <pre class="text-xs bg-slate-950/70 border border-white/10 rounded p-3 max-h-[460px] overflow-auto" x-text="formatJson(indexStatus)"></pre>
                </div>
                <div class="glass-panel p-5">
                    <h3 class="font-bold text-slate-100 mb-4">Maintenance</h3>
                    <button class="glass-btn px-3 py-2 text-xs mb-4" @click="runMaintenance()">Run once</button>
                    <pre class="text-xs bg-slate-950/70 border border-white/10 rounded p-3 max-h-[460px] overflow-auto" x-text="formatJson(maintenanceReport)"></pre>
                </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_420px] gap-6">
                    <div class="glass-panel p-5">
                        <div class="flex items-center justify-between gap-3 mb-4">
                            <h3 class="font-bold text-slate-100">Memory Events Feed</h3>
                            <button class="glass-btn px-3 py-2 text-xs" @click="loadObservabilityEvents(); loadObservabilityErrors(); if (observabilityChatId) loadObservabilityChat();">Refresh</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
                            <input class="form-input" placeholder="chat_id" x-model="observabilityChatId" @change="loadObservabilityChat(); loadObservabilityEvents(); loadObservabilityErrors();">
                            <select class="form-input" x-model="observabilityFilters.component" @change="loadObservabilityEvents()">
                                <option value="">all components</option>
                                <option value="instant_gate">instant_gate</option>
                                <option value="memory_pipeline">memory_pipeline</option>
                                <option value="session_summarizer">session_summarizer</option>
                            </select>
                            <select class="form-input" x-model="observabilityFilters.level" @change="loadObservabilityEvents()">
                                <option value="">all levels</option>
                                <option value="info">info</option>
                                <option value="warning">warning</option>
                                <option value="error">error</option>
                            </select>
                            <input class="form-input" type="number" min="1" max="200" x-model="observabilityFilters.limit" @change="loadObservabilityEvents(); loadObservabilityErrors();">
                        </div>
                        <div class="space-y-3 max-h-[520px] overflow-auto">
                            <template x-for="item in observabilityEvents" :key="item.event_id">
                                <div class="border border-white/10 rounded-lg p-3 bg-slate-900/40">
                                    <div class="flex items-center justify-between gap-3 text-xs mb-2">
                                        <div class="flex gap-2 items-center">
                                            <span class="px-2 py-1 rounded bg-slate-800 text-slate-300" x-text="item.component"></span>
                                            <span class="px-2 py-1 rounded"
                                                  :class="item.level === 'error' ? 'bg-rose-500/20 text-rose-300' : (item.level === 'warning' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/15 text-emerald-300')"
                                                  x-text="item.level"></span>
                                            <span class="text-brand-300" x-text="item.stage"></span>
                                        </div>
                                        <span class="text-slate-500" x-text="formatDate(item.timestamp)"></span>
                                    </div>
                                    <div class="text-sm text-slate-200" x-text="item.summary || item.reason || '(no summary)'"></div>
                                    <div class="mt-2 text-xs text-slate-500" x-text="item.chat_id"></div>
                                </div>
                            </template>
                            <template x-if="!observabilityEvents.length">
                                <div class="text-sm text-slate-500 py-10 text-center">No observability events yet.</div>
                            </template>
                        </div>
                    </div>

                    <div class="flex flex-col gap-6">
                        <div class="glass-panel p-5">
                            <h3 class="font-bold text-slate-100 mb-4">Chat Drill-down</h3>
                            <pre class="text-xs bg-slate-950/70 border border-white/10 rounded p-3 max-h-[260px] overflow-auto" x-text="formatJson(observabilityChatStatus)"></pre>
                        </div>
                        <div class="glass-panel p-5">
                            <h3 class="font-bold text-slate-100 mb-4">Recent Errors</h3>
                            <div class="space-y-3 max-h-[220px] overflow-auto">
                                <template x-for="item in observabilityErrors" :key="item.event_id">
                                    <div class="border border-white/10 rounded-lg p-3 bg-slate-900/40">
                                        <div class="flex items-center justify-between gap-3 text-xs mb-2">
                                            <span class="px-2 py-1 rounded"
                                                  :class="item.level === 'error' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'"
                                                  x-text="item.level"></span>
                                            <span class="text-slate-500" x-text="formatDate(item.timestamp)"></span>
                                        </div>
                                        <div class="text-sm text-slate-200" x-text="item.summary || item.reason || '(no summary)'"></div>
                                        <div class="mt-2 text-xs text-slate-500" x-text="`${item.component} / ${item.stage}`"></div>
                                    </div>
                                </template>
                                <template x-if="!observabilityErrors.length">
                                    <div class="text-sm text-slate-500 py-6 text-center">No recent warnings or errors.</div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- EVENTS TAB -->
        <template x-if="currentTab === 'events'">
            <div class="flex flex-col gap-6">
                <div class="flex justify-end">
                    <button class="glass-btn px-4 py-2 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 font-medium text-sm flex items-center gap-2" @click="openEventModal()">
                        <i data-lucide="plus" class="w-4 h-4"></i> 鏂板鏍稿績璁板繂
                    </button>
                </div>
                
                <div class="glass-panel overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b border-white/10 text-slate-400 text-sm bg-slate-800/50">
                                    <th class="px-6 py-3 whitespace-nowrap">鏃堕棿 / ID</th>
                                    <th class="px-6 py-3 whitespace-nowrap">鍒嗙被 / 鏉ユ簮</th>
                                    <th class="px-6 py-3">璁板繂鍙欎簨 (Narrative)</th>
                                    <th class="px-6 py-3 whitespace-nowrap">閲嶈搴?/th>
                                    <th class="px-6 py-3 w-20 whitespace-nowrap">鎿嶄綔</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-slate-300">
                                <template x-for="ev in events" :key="ev.id">
                                    <tr class="border-b border-white/5 even:bg-white/[0.02] hover:bg-slate-800/40 group">
                                        <td class="px-6 py-4 font-mono text-xs whitespace-nowrap">
                                        <div x-text="ev.date" class="text-brand-300 mb-1"></div>
                                        <div x-text="'#'+ev.id" class="text-slate-500"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 py-1 rounded text-xs font-bold tracking-wider bg-slate-800 text-slate-300 border border-slate-600 block w-max mb-1" x-text="ev.memory_kind"></span>
                                        <span class="text-xs text-slate-500" x-text="'Source: ' + ev.source_layer"></span>
                                    </td>
                                    <td class="px-6 py-4 max-w-md">
                                        <p x-text="ev.narrative"></p>
                                        <div class="flex gap-1 mt-2 flex-wrap">
                                            <template x-for="tag in (ev.tags || '').split(',').filter(Boolean)">
                                                <span class="px-1.5 py-0.5 rounded text-[10px] bg-brand-500/20 text-brand-300 border border-brand-500/30" x-text="tag"></span>
                                            </template>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center gap-2">
                                            <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                                <div class="h-full bg-gradient-to-r from-amber-500 to-rose-500" :style="`width: ${ev.importance * 100}%`"></div>
                                            </div>
                                            <span class="text-xs text-slate-400" x-text="ev.importance.toFixed(2)"></span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button class="w-8 h-8 rounded flex items-center justify-center hover:bg-rose-500/20 text-slate-500 hover:text-rose-400" @click="delEvent(ev.id)">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="!events.length">
                                <tr>
                                    <td colspan="5" class="p-8">
                                        <div class="empty-state border-none bg-transparent p-4">
                                            <i data-lucide="inbox"></i>
                                            <p>鏆傛棤鏍稿績璁板繂纰庣墖</p>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </template>

        <!-- REFLECTIONS TAB -->
        <template x-if="currentTab === 'reflections'">
            <div class="flex flex-col gap-6">
                <!-- Month Navigator -->
                <div class="glass-panel p-4 flex justify-between items-center">
                    <button class="w-10 h-10 flex items-center justify-center rounded hover:bg-white/10 text-slate-300" @click="prevMonth()"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <h3 class="text-xl font-bold text-slate-100 tracking-widest" x-text="currentMonthStr"></h3>
                    <button class="w-10 h-10 flex items-center justify-center rounded hover:bg-white/10 text-slate-300" @click="nextMonth()"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
                
                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-4">
                    <template x-for="dayName in ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
                        <div class="text-center text-xs font-bold text-slate-500 uppercase tracking-widest" x-text="dayName"></div>
                    </template>
                    
                    <template x-for="(dayDate, index) in calendarDays" :key="index">
                        <div class="glass-panel min-h-[120px] p-3 flex flex-col relative group" 
                             :class="!dayDate ? 'opacity-0 pointer-events-none' : (reflectionsMap[dayDate] ? 'border-brand-500/30 bg-brand-500/5' : 'border-white/5')">
                            
                            <template x-if="dayDate">
                                <div class="flex-1 flex flex-col cursor-pointer" @click="openReflection(dayDate)">
                                    <div class="text-sm font-mono text-slate-400 mb-2" x-text="dayDate.split('-')[2]"></div>
                                    <template x-if="reflectionsMap[dayDate]">
                                        <div class="text-xs text-brand-300 line-clamp-3 leading-relaxed" x-text="reflectionsMap[dayDate].summary"></div>
                                    </template>
                                    <template x-if="!reflectionsMap[dayDate]">
                                        <div class="text-xs text-slate-600 italic">鏃犳棩蹇?/div>
                                    </template>
                                </div>
                            </template>

                            <!-- Inline Editor Dropdown -->
                            <div x-show="activeReflectionDate === dayDate" class="absolute top-full left-0 z-50 w-80 mt-2 glass-panel p-4 shadow-2xl border border-brand-500/50" @click.stop>
                                <h4 class="text-sm font-bold text-white mb-2 flex justify-between items-center">
                                    <span x-text="dayDate"></span>
                                    <template x-if="reflectionsMap[dayDate]">
                                        <button class="text-rose-400 hover:text-rose-300" @click="delReflection(dayDate)"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </template>
                                </h4>
                                <textarea :id="`ref-input-${dayDate}`" class="w-full h-32 bg-slate-900 border border-white/10 rounded p-3 text-sm text-slate-300 resize-none focus:outline-none focus:border-brand-500 mb-3" 
                                          x-text="reflectionsMap[dayDate] ? reflectionsMap[dayDate].summary : ''" placeholder="鎾板啓鎴栦慨鏀逛粖鏃ュ弽鎬?.."></textarea>
                                <div class="flex justify-end gap-2">
                                    <button class="px-3 py-1.5 rounded text-xs text-slate-400 hover:bg-white/10" @click="activeReflectionDate = null">鍙栨秷</button>
                                    <button class="px-3 py-1.5 rounded text-xs bg-brand-500 text-white hover:bg-brand-600" @click="saveReflection(dayDate)">淇濆瓨</button>
                                </div>
                            </div>

                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- NODES TAB -->
        <template x-if="currentTab === 'nodes'">
            <div class="flex flex-col gap-6">
                <div class="flex justify-end">
                    <button class="glass-btn px-4 py-2 bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 font-medium text-sm flex items-center gap-2" @click="openNodeModal()">
                        <i data-lucide="plus" class="w-4 h-4"></i> 鏂板瀹炰綋鑺傜偣
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <template x-for="node in nodes" :key="node.id">
                        <div class="glass-panel p-5 relative group">
                            <div class="absolute top-4 right-4 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="w-7 h-7 rounded bg-white/10 flex items-center justify-center hover:bg-blue-500/20 text-blue-300" @click="openNodeModal(node)">
                                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                </button>
                                <button class="w-7 h-7 rounded bg-white/10 flex items-center justify-center hover:bg-rose-500/20 text-rose-400" @click="delNode(node.id)">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <div class="flex items-center gap-3 mb-3">
                                <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400">
                                    <i data-lucide="network" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-lg leading-tight" x-text="node.name"></h4>
                                    <span class="text-[10px] font-mono text-slate-500 uppercase tracking-wider" x-text="node.type"></span>
                                </div>
                            </div>
                            <p class="text-sm text-slate-300 line-clamp-4 leading-relaxed" x-text="node.description"></p>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- JARGON TAB -->
        <template x-if="currentTab === 'jargon'">
            <div class="flex flex-col gap-6">
                <div class="glass-panel p-4 flex flex-wrap items-center gap-3">
                    <select class="bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="jargonFilters.status" @change="loadJargons()">
                        <option value="">全部状态</option>
                        <option value="active">active</option>
                        <option value="review_pending">review_pending</option>
                        <option value="rejected">rejected</option>
                        <option value="stale">stale</option>
                        <option value="deleted">deleted</option>
                        <option value="merged">merged</option>
                    </select>
                    <input type="text" class="bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="jargonFilters.group_id" @change="loadJargons()" placeholder="Group ID">
                    <input type="text" class="flex-1 min-w-[180px] bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="jargonFilters.query" @input.debounce.300ms="loadJargons()" placeholder="搜索词条 / 含义 / 场景 / 例句">
                    <button class="glass-btn px-4 py-2 bg-purple-500/20 text-purple-400 hover:bg-purple-500/30 font-medium text-sm flex items-center gap-2" @click="openJargonModal()">
                        <i data-lucide="plus" class="w-4 h-4"></i> 新增黑话
                    </button>
                </div>

                <div class="grid lg:grid-cols-[minmax(0,1.25fr)_360px] gap-6 items-start">
                    <div class="glass-panel overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="border-b border-white/10 text-slate-400 text-sm bg-slate-800/50">
                                        <th class="px-6 py-3 whitespace-nowrap">词条</th>
                                        <th class="px-6 py-3">释义</th>
                                        <th class="px-6 py-3 whitespace-nowrap">群组</th>
                                        <th class="px-6 py-3 whitespace-nowrap">状态</th>
                                        <th class="px-6 py-3 whitespace-nowrap">置信度</th>
                                        <th class="px-6 py-3 w-32 whitespace-nowrap">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="text-sm text-slate-300">
                                    <template x-for="j in jargons" :key="j.id">
                                        <tr class="border-b border-white/5 even:bg-white/[0.02] hover:bg-slate-800/40 cursor-pointer" :class="selectedJargon && selectedJargon.id === j.id ? 'bg-purple-500/10' : ''" @click="selectJargon(j)">
                                            <td class="px-6 py-4 font-bold text-purple-300 text-base whitespace-nowrap" x-text="j.content"></td>
                                            <td class="px-6 py-4 max-w-sm"><p class="line-clamp-2" x-text="j.meaning || '-' "></p></td>
                                            <td class="px-6 py-4 font-mono text-xs text-slate-500 whitespace-nowrap" x-text="j.group_id"></td>
                                            <td class="px-6 py-4 whitespace-nowrap">
                                                <span class="px-2 py-0.5 rounded text-[10px] border uppercase" :class="j.status === 'active' ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300' : (j.status === 'review_pending' ? 'bg-amber-500/20 border-amber-500/30 text-amber-300' : (j.status === 'rejected' ? 'bg-rose-500/20 border-rose-500/30 text-rose-300' : 'bg-slate-800 border-slate-600 text-slate-300'))" x-text="j.status"></span>
                                            </td>
                                            <td class="px-6 py-4 whitespace-nowrap" x-text="Number(j.confidence || 0).toFixed(2)"></td>
                                            <td class="px-6 py-4 whitespace-nowrap">
                                                <div class="flex gap-1">
                                                    <button class="w-8 h-8 rounded flex items-center justify-center hover:bg-purple-500/20 text-slate-500 hover:text-purple-400" @click.stop="openJargonModal(j)">
                                                        <i data-lucide="edit-2" class="w-4 h-4"></i>
                                                    </button>
                                                    <button class="w-8 h-8 rounded flex items-center justify-center hover:bg-rose-500/20 text-slate-500 hover:text-rose-400" @click.stop="delJargon(j.id)">
                                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="!jargons.length">
                                        <tr>
                                            <td colspan="6" class="p-8">
                                                <div class="empty-state border-none bg-transparent p-4">
                                                    <i data-lucide="book-x"></i>
                                                    <p>暂无黑话记录</p>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="glass-panel p-5 flex flex-col gap-4" x-show="selectedJargon" x-cloak>
                        <div>
                            <div class="text-[10px] uppercase tracking-wider text-slate-500">Canonical Jargon</div>
                            <h3 class="text-xl font-bold text-white mt-1" x-text="selectedJargon?.content || '-' "></h3>
                            <div class="flex flex-wrap gap-2 mt-3">
                                <span class="px-2 py-0.5 rounded text-[10px] border" :class="selectedJargon?.status === 'active' ? 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300' : 'bg-slate-800 border-slate-600 text-slate-300'" x-text="selectedJargon?.status || '-' "></span>
                                <span class="px-2 py-0.5 rounded text-[10px] border bg-slate-800 border-slate-600 text-slate-300" x-text="selectedJargon?.review_status || '-' "></span>
                                <span class="px-2 py-0.5 rounded text-[10px] border bg-slate-800 border-slate-600 text-slate-300" x-text="selectedJargon?.source || '-' "></span>
                            </div>
                        </div>

                        <div class="space-y-3 text-sm text-slate-300">
                            <div><div class="text-slate-500 text-xs uppercase mb-1">释义</div><div x-text="selectedJargon?.meaning || '-' "></div></div>
                            <div><div class="text-slate-500 text-xs uppercase mb-1">场景</div><div x-text="selectedJargon?.scene || '-' "></div></div>
                            <div><div class="text-slate-500 text-xs uppercase mb-1">例句</div><div class="whitespace-pre-wrap" x-text="(selectedJargon?.examples || []).join('\n') || '-' "></div></div>
                            <div class="grid grid-cols-2 gap-3 text-xs text-slate-400">
                                <div>confidence: <span class="text-slate-200" x-text="Number(selectedJargon?.confidence || 0).toFixed(2)"></span></div>
                                <div>importance: <span class="text-slate-200" x-text="Number(selectedJargon?.importance || 0).toFixed(2)"></span></div>
                                <div>group: <span class="text-slate-200" x-text="selectedJargon?.group_id || '-' "></span></div>
                                <div>legacy id: <span class="text-slate-200" x-text="selectedJargon?.legacy_jargon_id || '-' "></span></div>
                                <div>last access: <span class="text-slate-200" x-text="formatDate(selectedJargon?.last_access_time)"></span></div>
                                <div>visibility: <span class="text-slate-200" x-text="selectedJargon?.visibility || '-' "></span></div>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2 pt-2 border-t border-white/10">
                            <button class="glass-btn px-3 py-2 text-xs bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30" @click="approveJargon(selectedJargon.id)">Approve</button>
                            <button class="glass-btn px-3 py-2 text-xs bg-rose-500/20 text-rose-300 hover:bg-rose-500/30" @click="rejectJargon(selectedJargon.id)">Reject</button>
                            <button class="glass-btn px-3 py-2 text-xs bg-sky-500/20 text-sky-300 hover:bg-sky-500/30" @click="restoreJargon(selectedJargon.id)">Restore</button>
                            <button class="glass-btn px-3 py-2 text-xs bg-amber-500/20 text-amber-300 hover:bg-amber-500/30" @click="markJargonStale(selectedJargon.id)">Mark stale</button>
                        </div>
                        <div class="flex gap-2 items-center pt-2 border-t border-white/10">
                            <input type="text" class="flex-1 bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="jargonMergeTargetId" placeholder="合并目标 canonical id">
                            <button class="glass-btn px-3 py-2 text-xs bg-purple-500/20 text-purple-300 hover:bg-purple-500/30" @click="mergeJargon(selectedJargon.id)">Merge</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- MODALS -->

    <!-- Event Modal -->
    <div x-show="showEventModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#090A10]/60 backdrop-blur-[12px] p-4" x-cloak>
        <div class="glass-panel w-full max-w-lg p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto" @click.away="showEventModal = false">
            <h3 class="text-xl font-bold text-slate-100 mb-6">鏂板鏍稿績璁板繂纰庣墖</h3>
            <div class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">璁板繂鍙欎簨 (Narrative)</label>
                    <textarea class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white resize-none h-24 focus:border-brand-500 focus:outline-none" x-model="newEvent.narrative" placeholder="鎻忚堪鍙戠敓鐨勫瑙備簨瀹?.."></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">鍒嗙被 (Kind)</label>
                        <select class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="newEvent.memory_kind">
                            <option value="Preference">Preference (鍋忓ソ)</option>
                            <option value="Event">Event (浜嬩欢)</option>
                            <option value="Relationship">Relationship (鍏崇郴)</option>
                            <option value="Misc">Misc (鏉傞」)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">閲嶈搴?(Importance 0-1)</label>
                        <input type="number" step="0.1" min="0" max="1" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="newEvent.importance">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">鏍囩 (Tags 閫楀彿鍒嗛殧)</label>
                    <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="newEvent.tags" placeholder="渚嬪: preference, food">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button class="px-5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/10" @click="showEventModal = false">鍙栨秷</button>
                <button class="px-5 py-2 rounded-lg text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white" @click="saveEvent()">纭?璁?/button>
            </div>
        </div>
    </div>

    <!-- Node Modal -->
    <div x-show="showNodeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#090A10]/60 backdrop-blur-[12px] p-4" x-cloak>
        <div class="glass-panel w-full max-w-lg p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto" @click.away="showNodeModal = false">
            <h3 class="text-xl font-bold text-slate-100 mb-6" x-text="newNode.id ? '缂栬緫瀹炰綋鑺傜偣' : '鏂板瀹炰綋鑺傜偣'"></h3>
            <div class="flex flex-col gap-4">
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">鑺傜偣鍚嶇О (Name)</label>
                        <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-blue-500 focus:outline-none" x-model="newNode.name">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">绫诲瀷 (Type)</label>
                        <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-blue-500 focus:outline-none" x-model="newNode.type" placeholder="濡?user">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">鑺傜偣鎻忚堪 (Description)</label>
                    <textarea class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white resize-none h-32 focus:border-blue-500 focus:outline-none" x-model="newNode.description"></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button class="px-5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/10" @click="showNodeModal = false">鍙栨秷</button>
                <button class="px-5 py-2 rounded-lg text-sm font-medium bg-blue-500 hover:bg-blue-600 text-white" @click="saveNode()">淇?瀛?/button>
            </div>
        </div>
    </div>

    <!-- Jargon Modal -->
    <div x-show="showJargonModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#090A10]/60 backdrop-blur-[12px] p-4" x-cloak>
        <div class="glass-panel w-full max-w-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto" @click.away="showJargonModal = false">
            <h3 class="text-xl font-bold text-slate-100 mb-6" x-text="newJargon.id ? '编辑 canonical 黑话' : '新增 canonical 黑话'"></h3>
            <div class="flex flex-col gap-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">词条 (Content)</label>
                        <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="newJargon.content" :disabled="!!newJargon.id" :class="newJargon.id ? 'opacity-50 cursor-not-allowed' : ''">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">群组 (Group ID)</label>
                        <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="newJargon.group_id" :disabled="!!newJargon.id" :class="newJargon.id ? 'opacity-50 cursor-not-allowed' : ''">
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">状态 (Status)</label>
                        <select class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="newJargon.status">
                            <option value="active">active</option>
                            <option value="review_pending">review_pending</option>
                            <option value="rejected">rejected</option>
                            <option value="stale">stale</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">场景 (Scene)</label>
                        <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-sm text-white focus:border-purple-500 focus:outline-none" x-model="newJargon.scene">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">释义 (Meaning)</label>
                    <textarea class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white resize-none h-24 focus:border-purple-500 focus:outline-none" x-model="newJargon.meaning"></textarea>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">例句 (Examples, one per line)</label>
                    <textarea class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white resize-none h-24 focus:border-purple-500 focus:outline-none" x-model="newJargon.examples_text"></textarea>
                </div>
                <div class="flex gap-6 mt-2">
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
                        <input type="checkbox" class="rounded border-white/10 bg-slate-900 text-purple-500 focus:ring-purple-500 focus:ring-offset-0" x-model="newJargon.is_jargon" :true-value="1" :false-value="0">
                        标记为真实黑话
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
                        <input type="checkbox" class="rounded border-white/10 bg-slate-900 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0" x-model="newJargon.is_complete" :true-value="1" :false-value="0">
                        释义完整
                    </label>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button class="px-5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/10" @click="showJargonModal = false">取消</button>
                <button class="px-5 py-2 rounded-lg text-sm font-medium bg-purple-500 hover:bg-purple-600 text-white" @click="saveJargon()">保存</button>
            </div>
        </div>
    </div>
</div>
