<div id="page-learning" x-show="currentPage === 'learning'" x-data="learningPage()" x-cloak class="pb-10">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">主动学习与任务</h2>
            <p class="text-slate-400">监控 AI 的独立思考周期、夜间造梦及反思过滤池</p>
        </div>
    </div>

    <div x-show="loading && !proactiveStatus" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-brand-500"></i>
        <p>正在读取学习中心数据...</p>
    </div>

    <div x-show="proactiveStatus !== null" class="flex flex-col gap-8">
        
        <!-- Proactive Task Controllers -->
        <section>
            <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i data-lucide="zap" class="w-5 h-5 text-amber-400"></i>
                主动组件调度 (Proactive Triggers)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Dream Agent -->
                <div class="glass-panel p-8 flex flex-col justify-between group relative overflow-hidden">
                    <div class="absolute inset-0 bg-slate-800/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <h4 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="moon-star" class="w-5 h-5 text-purple-400"></i> 造梦空间
                            </h4>
                            <div class="w-2.5 h-2.5 rounded-full" :class="dreamStatus?.dream_agent_bound ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-600'"></div>
                        </div>
                        <p class="text-sm text-slate-400 mb-2">后台整理长线抽象记忆</p>
                        <p class="text-xs text-slate-500 font-mono">上次运行: <span x-text="formatTime(dreamStatus?.last_run_time)"></span></p>
                    </div>
                    <button class="mt-6 w-full glass-btn px-4 py-2 font-medium text-sm flex items-center justify-center gap-2 text-purple-300 hover:text-purple-200 hover:bg-purple-500/20 hover:border-purple-500/50" 
                            @click="triggerDream()" :disabled="!dreamStatus?.dream_agent_bound"
                            :class="!dreamStatus?.dream_agent_bound ? 'opacity-50 cursor-not-allowed' : ''">
                        <i data-lucide="play" class="w-4 h-4"></i> 执行造梦序列
                    </button>
                </div>

                <!-- Diary Agent -->
                <div class="glass-panel p-8 flex flex-col justify-between group relative overflow-hidden">
                    <div class="absolute inset-0 bg-slate-800/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <h4 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="book-open-text" class="w-5 h-5 text-brand-400"></i> 日记写作
                            </h4>
                            <div class="w-2.5 h-2.5 rounded-full" :class="diaryStatus?.available ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-600'"></div>
                        </div>
                        <p class="text-sm text-slate-400 mb-2">生成每日大盘日记</p>
                        <p class="text-xs text-slate-500 font-mono">最后归档: <span x-text="diaryStatus?.last_diary_date || '无'"></span></p>
                    </div>
                    <button class="mt-6 w-full glass-btn px-4 py-2 font-medium text-sm flex items-center justify-center gap-2 text-brand-300 hover:text-brand-200 hover:bg-brand-500/20 hover:border-brand-500/50" 
                            @click="triggerDiary()" :disabled="!diaryStatus?.available"
                            :class="!diaryStatus?.available ? 'opacity-50 cursor-not-allowed' : ''">
                        <i data-lucide="play" class="w-4 h-4"></i> 撰写今日日记
                    </button>
                </div>

                <!-- Learning & Reflection -->
                <div class="glass-panel p-8 flex flex-col justify-between group relative overflow-hidden">
                    <div class="absolute inset-0 bg-slate-800/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <h4 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                                <i data-lucide="library" class="w-5 h-5 text-emerald-400"></i> 沉淀审核
                            </h4>
                            <div class="w-2.5 h-2.5 rounded-full" :class="learningStatus?.reflector ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-600'"></div>
                        </div>
                        <p class="text-sm text-slate-400 mb-2">自动化知识提取与习惯学习</p>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider" :class="learningStatus?.auto_check_task ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'">AUTO CHECK</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider" :class="learningStatus?.reflect_tracker ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'">TRACKER</span>
                        </div>
                    </div>
                    <div class="mt-6 w-full px-4 py-2 font-medium text-sm text-center text-emerald-500/50 border border-emerald-500/20 rounded-lg bg-emerald-500/5">
                        基于会话独立触发
                    </div>
                </div>
            </div>
        </section>

        <!-- Active Chats & Reflection Triggers -->
        <section>
            <h3 class="text-xl font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i data-lucide="messages-square" class="w-5 h-5 text-blue-400"></i>
                近期活跃会话干预
            </h3>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <template x-for="chat in activeChats" :key="chat.chat_id">
                    <div class="glass-panel p-6 flex justify-between items-center gap-4 group">
                        <div class="min-w-0 pr-4">
                            <h5 class="text-white font-bold truncate mb-1" x-text="chat.chat_id"></h5>
                            <p class="text-xs text-slate-400 truncate" x-text="(chat.sender || '-') + ': ' + (chat.preview || '')"></p>
                            <p class="text-[10px] text-amber-400 mt-1" x-show="chat.wait_target_name" x-text="'等待目标: ' + chat.wait_target_name"></p>
                            <p class="text-[10px] text-slate-500 font-mono mt-1" x-text="formatTime(chat.latest_activity_ts)"></p>
                        </div>
                        <button class="flex-shrink-0 glass-btn px-4 py-2 text-xs font-medium text-emerald-400 hover:bg-emerald-500/20 hover:border-emerald-500/40"
                                @click="triggerReflect(chat.chat_id)">
                            <i data-lucide="search-check" class="w-4 h-4 mr-1 inline"></i>立刻反思
                        </button>
                        <button class="flex-shrink-0 glass-btn px-3 py-2 text-xs font-medium text-rose-300 hover:bg-rose-500/20 hover:border-rose-500/40"
                                @click="clearChatRuntime(chat.chat_id)" title="清理会话运行态">
                            <i data-lucide="eraser" class="w-4 h-4"></i>
                        </button>
                    </div>
                </template>
                <template x-if="activeChats.length === 0">
                    <div class="col-span-full empty-state">
                        <i data-lucide="inbox"></i>
                        <p>过去 30 分钟内无活跃会话</p>
                    </div>
                </template>
            </div>
        </section>

        <!-- Memory Feedback Pool -->
        <section>
            <h3 class="text-xl font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i data-lucide="database-zap" class="w-5 h-5 text-rose-400"></i>
                认知反馈记录 (Memory Feedback)
            </h3>
            <div class="flex flex-wrap gap-2 mb-4">
                <template x-for="source in feedbackSources" :key="source.source">
                    <span class="px-3 py-1 rounded-full text-xs bg-rose-500/10 text-rose-300 border border-rose-500/20">
                        <span x-text="source.source"></span>
                        <span class="text-rose-200/60">·</span>
                        <span x-text="source.count"></span>
                    </span>
                </template>
                <template x-if="feedbackSources.length === 0">
                    <span class="text-sm text-slate-500">暂无反馈来源统计</span>
                </template>
            </div>
            <div class="glass-panel overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-white/10 text-slate-400 text-sm bg-slate-800/50">
                                <th class="px-6 py-3 font-medium whitespace-nowrap">时间 / ID</th>
                                <th class="px-6 py-3 font-medium whitespace-nowrap">来源</th>
                                <th class="px-6 py-3 font-medium">反思内容摘要</th>
                                <th class="px-6 py-3 font-medium whitespace-nowrap">操作</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm">
                            <template x-for="item in feedbackItems" :key="item.id">
                                <tr class="border-b border-white/5 even:bg-white/[0.02] hover:bg-slate-800/40 transition-colors group">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-slate-300 font-medium mb-1" x-text="formatTime(item.timestamp)"></div>
                                        <div class="text-[10px] text-slate-500 font-mono" x-text="item.id"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-rose-500/20 text-rose-300 border border-rose-500/30" x-text="item.source"></span>
                                        <div class="text-xs text-slate-500 mt-1" x-text="item.chat_id"></div>
                                    </td>
                                    <td class="px-6 py-4 max-w-md">
                                        <p class="text-slate-200 line-clamp-2" x-text="item.summary"></p>
                                        <p class="text-xs text-slate-400 mt-1 line-clamp-1 italic" x-text="item.guidance"></p>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <button class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-rose-400 hover:bg-rose-500/20 transition-colors"
                                                @click="deleteFeedback(item.id)" title="禁用此反馈">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <template x-if="feedbackItems.length === 0">
                                <tr>
                                    <td colspan="4" class="p-8">
                                        <div class="empty-state border-none bg-transparent p-4">
                                            <i data-lucide="check-circle-2"></i>
                                            <p>当前无认知反馈记录</p>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
</div>
