<div id="page-login" x-show="currentPage === 'login'" x-data="loginPage()" class="w-full" x-cloak>
    <div class="glass-panel p-8 sm:p-10 w-full relative overflow-hidden">
        <div class="relative z-10 text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-lg bg-slate-800 border border-slate-700 mb-6">
                <i data-lucide="cpu" class="w-8 h-8 text-brand-400"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">AstrMai 中心节点</h2>
            <p class="text-slate-400 text-sm">请输入系统密钥以建立连接</p>
        </div>

        <div class="relative z-10 flex flex-col gap-6">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="key" class="w-5 h-5 text-slate-500"></i>
                </div>
                <input type="password" 
                       class="glass-input pl-12 h-14 text-lg tracking-widest" 
                       placeholder="••••••••" 
                       x-model="password" 
                       @keydown.enter="submit" 
                       :disabled="loading">
            </div>
            
            <button class="glass-btn glass-btn-primary w-full h-14 text-lg" @click="submit" :disabled="loading">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin" x-show="loading"></i>
                <span x-text="loading ? '正在建立连接...' : '验证授权'"></span>
                <i data-lucide="arrow-right" class="w-5 h-5 ml-1" x-show="!loading"></i>
            </button>
            
            <div class="text-rose-400 text-sm min-h-[1.25rem] text-center font-medium transition-all duration-300" 
                 :class="error ? 'opacity-100' : 'opacity-0'" 
                 x-text="error"></div>
        </div>
    </div>
</div>
