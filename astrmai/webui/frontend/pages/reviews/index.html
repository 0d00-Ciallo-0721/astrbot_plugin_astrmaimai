<div id="page-reviews" x-show="currentPage === 'reviews'" x-data="reviewsPage()" x-cloak class="pb-10 h-full flex flex-col">
    <!-- Header -->
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">表达语料审核 (Reviews)</h2>
            <p class="text-slate-400">管理 AI 提取的话术习惯，决定其是否被加入核心表达网络</p>
        </div>
        
        <div class="glass-panel p-1.5 flex gap-1 rounded-lg">
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="tab === 'pending' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="switchTab('pending')">待审队列 (Pending)</button>
            <button class="px-4 py-2 rounded-lg text-sm font-medium transition-all"
                    :class="tab === 'all' ? 'bg-brand-500/10 text-brand-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'"
                    @click="switchTab('all')">全量库查阅 (All)</button>
        </div>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-brand-500"></i>
        <p>正在读取网络数据...</p>
    </div>

    <div x-show="!loading" class="flex-1">

        <!-- PENDING TAB -->
        <template x-if="tab === 'pending'">
            <div class="flex flex-col gap-4">
                <div class="flex justify-between items-center glass-panel p-4 sticky top-4 z-10 shadow-lg">
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-300 font-medium">
                            <input type="checkbox" class="rounded border-white/10 bg-slate-900 text-brand-500 focus:ring-brand-500" 
                                   @change="toggleSelectAll($event)" :checked="selectedIds.length > 0 && selectedIds.length === pendingItems.length">
                            本页全选
                        </label>
                        <span class="text-xs text-slate-500" x-text="`已选中 ${selectedIds.length} 项`"></span>
                    </div>
                    <div class="flex gap-2">
                        <button class="glass-btn px-4 py-1.5 text-xs font-medium text-emerald-400 hover:bg-emerald-500/20" @click="batchReview('approve')" :disabled="!selectedIds.length" :class="!selectedIds.length ? 'opacity-50 cursor-not-allowed' : ''">
                            <i data-lucide="check-circle" class="w-3.5 h-3.5 inline mr-1"></i> 批量批准
                        </button>
                        <button class="glass-btn px-4 py-1.5 text-xs font-medium text-rose-400 hover:bg-rose-500/20" @click="batchReview('reject')" :disabled="!selectedIds.length" :class="!selectedIds.length ? 'opacity-50 cursor-not-allowed' : ''">
                            <i data-lucide="x-circle" class="w-3.5 h-3.5 inline mr-1"></i> 批量驳回
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <template x-for="item in pendingItems" :key="item.id">
                        <div class="glass-panel p-6 flex flex-col md:flex-row gap-6 relative group border border-white/5 hover:border-brand-500/30 transition-colors">
                            <div class="absolute top-5 left-4">
                                <input type="checkbox" class="rounded border-white/10 bg-slate-900 text-brand-500 focus:ring-brand-500" :value="item.id" x-model="selectedIds">
                            </div>
                            
                            <div class="pl-8 flex-1 min-w-0 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-slate-100 text-base mb-1 flex items-center gap-2">
                                        <i data-lucide="message-square-dashed" class="w-4 h-4 text-slate-400"></i>
                                        <span x-text="item.situation"></span>
                                    </h4>
                                    <div class="flex items-center gap-3 text-xs font-mono text-slate-500 mb-3">
                                        <span x-text="'ID: ' + item.id"></span>
                                        <span x-text="'Group: ' + item.group_id"></span>
                                    </div>
                                    <div class="flex items-start gap-2">
                                        <span class="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400 uppercase tracking-wider whitespace-nowrap mt-1">原句提炼</span>
                                        <p class="text-sm text-slate-300 italic bg-white/5 p-2 rounded-lg flex-1" x-text="item.expression"></p>
                                    </div>
                                </div>
                                
                                <div class="mt-4 flex gap-4">
                                    <div class="flex-1">
                                        <label class="text-[10px] text-brand-400 font-bold uppercase tracking-wider block mb-1">人工重写 (可选)</label>
                                        <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-white focus:border-brand-500 focus:outline-none placeholder-slate-600" 
                                               x-model="item.expression" placeholder="直接在此处修改话术...">
                                    </div>
                                    <div class="w-24">
                                        <label class="text-[10px] text-brand-400 font-bold uppercase tracking-wider block mb-1">权重 (Weight)</label>
                                        <input type="number" step="0.1" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-white focus:border-brand-500 focus:outline-none" 
                                               x-model="item.weight">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="w-full md:w-32 flex flex-row md:flex-col justify-center gap-2 border-t md:border-t-0 md:border-l border-white/5 pt-4 md:pt-0 md:pl-6 mt-2 md:mt-0">
                                <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-white transition-colors"
                                        @click="submitReview(item.id, 'approve', item)">
                                    批准生效
                                </button>
                                <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition-colors"
                                        @click="submitReview(item.id, 'reject')">
                                    坚决驳回
                                </button>
                            </div>
                        </div>
                    </template>
                    <template x-if="!pendingItems.length">
                        <div class="empty-state">
                            <i data-lucide="check-circle-2" class="text-emerald-500/50"></i>
                            <h3 class="text-lg font-medium text-slate-400 mt-2 mb-1">真棒！</h3>
                            <p>当前没有任何待审核的话术。</p>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ALL TAB -->
        <template x-if="tab === 'all'">
            <div class="flex flex-col gap-6">
                
                <!-- Filter Bar -->
                <div class="glass-panel p-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 items-end">
                    <div>
                        <select class="w-full glass-input text-sm" x-model="filters.status">
                            <option value="">所有状态</option>
                            <option value="pending">待审 (Pending)</option>
                            <option value="approved">批准 (Approved)</option>
                            <option value="rejected">驳回 (Rejected)</option>
                        </select>
                    </div>
                    <div>
                        <input type="text" class="w-full glass-input text-sm" x-model="filters.group_id" placeholder="群组 ID (默认 GLOBAL)">
                    </div>
                    <div>
                        <input type="text" class="w-full glass-input text-sm" x-model="filters.keyword" placeholder="关键词搜索...">
                    </div>
                    <div class="flex gap-2">
                        <button class="flex-1 glass-btn py-2 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 font-medium text-sm flex items-center justify-center" @click="openCreateModal()" title="手动新增">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                        <button class="flex-[2] glass-btn py-2 bg-brand-500 text-white hover:bg-brand-600 font-medium text-sm flex items-center justify-center gap-2" @click="applyFilters()">
                            <i data-lucide="search" class="w-4 h-4"></i> 查 询
                        </button>
                    </div>
                </div>
                
                <!-- Data Table -->
                <div class="glass-panel overflow-hidden flex flex-col">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="border-b border-white/10 text-slate-400 bg-slate-800/50">
                                    <th class="px-6 py-3 font-medium whitespace-nowrap">ID / 群组</th>
                                    <th class="px-6 py-3 font-medium">触发情境 (Situation)</th>
                                    <th class="px-6 py-3 font-medium">话术表达 (Expression)</th>
                                    <th class="px-6 py-3 font-medium whitespace-nowrap">风格/权重</th>
                                    <th class="px-6 py-3 font-medium whitespace-nowrap">当前状态</th>
                                    <th class="px-6 py-3 font-medium text-right whitespace-nowrap">操作</th>
                                </tr>
                            </thead>
                            <tbody class="text-slate-300">
                                <template x-for="item in allItems" :key="item.id">
                                    <tr class="border-b border-white/5 even:bg-white/[0.02] hover:bg-slate-800/40 group">
                                        <td class="px-6 py-4 font-mono text-xs whitespace-nowrap">
                                            <div class="text-white font-bold" x-text="item.id"></div>
                                            <div class="text-slate-500" x-text="item.group_id"></div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <p class="font-bold text-slate-200" x-text="item.situation"></p>
                                        </td>
                                        <td class="px-6 py-4 max-w-sm" x-data="{ expanded: false }">
                                            <div class="italic text-slate-300 relative cursor-pointer" @click="expanded = !expanded">
                                                <p :class="expanded ? '' : 'line-clamp-2'" x-text="item.expression"></p>
                                                <div x-show="item.expression.length > 50" class="text-[10px] text-brand-400 mt-1 flex items-center gap-1">
                                                    <span x-text="expanded ? '收起' : '展开'"></span>
                                                    <i data-lucide="chevron-down" class="w-3 h-3 transition-transform" :class="expanded ? 'rotate-180' : ''"></i>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="px-2 py-0.5 rounded-lg text-[10px] bg-slate-800 text-slate-400 border border-slate-700 mb-1 inline-block" x-text="item.style"></span>
                                            <div class="text-xs text-brand-400 font-mono" x-text="'W: ' + item.weight"></div>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="status-badge"
                                                  :class="{
                                                      'status-badge-success': item.status === 'approved',
                                                      'status-badge-danger': item.status === 'rejected',
                                                      'status-badge-warning': item.status === 'pending'
                                                  }">
                                                <i class="w-3 h-3 mr-1" :data-lucide="item.status === 'approved' ? 'check' : (item.status === 'rejected' ? 'x' : 'clock')"></i>
                                                <span x-text="item.status"></span>
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-right whitespace-nowrap">
                                            <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button class="w-8 h-8 rounded bg-white/5 hover:bg-brand-500/20 text-slate-400 hover:text-brand-400 flex items-center justify-center transition-colors" @click="openEditModal(item)">
                                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                                </button>
                                                <button class="w-8 h-8 rounded bg-white/5 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition-colors" @click="deleteItem(item.id)">
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="!allItems.length">
                                    <tr>
                                        <td colspan="6" class="p-8">
                                            <div class="empty-state">
                                                <i data-lucide="search-x"></i>
                                                <p>未能找到匹配的数据</p>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="p-4 border-t border-white/5 flex justify-between items-center bg-slate-900/50">
                        <span class="text-xs text-slate-500">
                            共 <span class="font-bold text-slate-300" x-text="total"></span> 条记录
                        </span>
                        <div class="flex items-center gap-4">
                            <span class="text-xs text-slate-400 font-mono">Page <span x-text="page"></span></span>
                            <div class="flex gap-1">
                                <button class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-300 disabled:opacity-30" 
                                        @click="prevPage()" :disabled="page <= 1">
                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                </button>
                                <button class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-300 disabled:opacity-30" 
                                        @click="nextPage()" :disabled="page * pageSize >= total">
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <!-- Edit/Create Modal -->
    <div x-show="showEditModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#090A10]/60 backdrop-blur-[12px] p-4" x-cloak>
        <div class="glass-panel w-full max-w-md p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto" @click.away="showEditModal = false">
            <h3 class="text-xl font-bold text-slate-100 mb-6" x-text="modalMode === 'edit' ? '编辑语料条目' : '新增语料记录'"></h3>
            <div class="flex flex-col gap-4">
                <template x-if="modalMode === 'create'">
                    <div class="flex flex-col gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">情境 (Situation)</label>
                            <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="editItem.situation" placeholder="如：被人打招呼">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">群组 ID (Group ID)</label>
                            <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="editItem.group_id" placeholder="GLOBAL">
                        </div>
                    </div>
                </template>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">表达 (Expression)</label>
                    <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="editItem.expression">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">风格 (Style)</label>
                    <input type="text" class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="editItem.style">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">权重 (Weight)</label>
                    <input type="number" step="0.1" class="w-full bg-slate-900 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-brand-500 focus:outline-none" x-model="editItem.weight">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button class="px-5 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/10" @click="showEditModal = false">取消</button>
                <button class="px-5 py-2 rounded-lg text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white" @click="saveEdit()">保 存</button>
            </div>
        </div>
    </div>

</div>
