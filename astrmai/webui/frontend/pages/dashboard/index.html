<div id="page-dashboard" x-show="currentPage === 'dashboard'" x-data="dashboardPage()" x-cloak class="pb-10">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">杩愯鐘舵€佸ぇ鐩?/h2>
            <p class="text-slate-400">瀹炴椂鐩戞帶 AstrMai 鏍稿績绯荤粺鐨勭敓鍛藉懆鏈熶笌璧勬簮鍒╃敤鐜?/p>
        </div>
        
        <!-- Global Health Indicator -->
        <template x-if="health?.data">
            <div class="glass-panel px-4 py-2 flex items-center gap-3">
                <div class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"
                        :class="!health.data.running ? 'bg-slate-400' : (health.data.degraded_count > 0 ? 'bg-amber-400' : 'bg-emerald-400')"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3"
                        :class="!health.data.running ? 'bg-slate-500' : (health.data.degraded_count > 0 ? 'bg-amber-500' : 'bg-emerald-500')"></span>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-slate-200" x-text="!health.data.running ? '绯荤粺鍋滄' : (health.data.degraded_count > 0 ? '閮ㄥ垎闄嶇骇杩愯' : '鍏ㄧ郴缁熷仴搴疯繍琛?)"></span>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider" x-text="'闃舵: ' + health.data.boot_phase"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Tabs Navigation -->
    <div class="flex gap-2 mb-8 border-b border-white/5 pb-px">
        <button class="px-6 py-3 font-medium text-sm transition-all relative"
                :class="currentTab === 'overview' ? 'text-brand-400' : 'text-slate-400 hover:text-slate-200'"
                @click="setTab('overview')">
            <div class="flex items-center gap-2">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                <span>杩愯姒傝</span>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-0.5 bg-brand-500 rounded-t-full transition-transform duration-300"
                 :class="currentTab === 'overview' ? 'scale-x-100' : 'scale-x-0'"></div>
        </button>
        <button class="px-6 py-3 font-medium text-sm transition-all relative"
                :class="currentTab === 'heartflow' ? 'text-rose-400' : 'text-slate-400 hover:text-slate-200'"
                @click="setTab('heartflow')">
            <div class="flex items-center gap-2">
                <i data-lucide="activity" class="w-4 h-4"></i>
                <span>蹇冩櫤娴?(Heartflow)</span>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-0.5 bg-rose-500 rounded-t-full transition-transform duration-300"
                 :class="currentTab === 'heartflow' ? 'scale-x-100' : 'scale-x-0'"></div>
        </button>
        <button class="px-6 py-3 font-medium text-sm transition-all relative"
                :class="currentTab === 'cognition' ? 'text-purple-400' : 'text-slate-400 hover:text-slate-200'"
                @click="setTab('cognition')">
            <div class="flex items-center gap-2">
                <i data-lucide="brain" class="w-4 h-4"></i>
                <span>涓诲姩鍐崇瓥姹?(Cognition)</span>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-0.5 bg-purple-500 rounded-t-full transition-transform duration-300"
                 :class="currentTab === 'cognition' ? 'scale-x-100' : 'scale-x-0'"></div>
        </button>
        <button class="px-6 py-3 font-medium text-sm transition-all relative"
                :class="currentTab === 'tools' ? 'text-emerald-400' : 'text-slate-400 hover:text-slate-200'"
                @click="setTab('tools')">
            <div class="flex items-center gap-2">
                <i data-lucide="wrench" class="w-4 h-4"></i>
                <span>宸ュ叿閾捐娴?(Tools)</span>
            </div>
            <div class="absolute bottom-0 left-0 w-full h-0.5 bg-emerald-500 rounded-t-full transition-transform duration-300"
                 :class="currentTab === 'tools' ? 'scale-x-100' : 'scale-x-0'"></div>
        </button>
    </div>

    <div x-show="loading && !stats" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-brand-500"></i>
        <p>姝ｅ湪鎷夊彇瀹炴椂鐩戞帶鏁版嵁...</p>
    </div>

    <!-- OVERVIEW TAB -->
        <div x-show="currentTab === 'overview'">
        <template x-if="stats">
            <div class="flex flex-col gap-8">
            
            <!-- Hardware / Resource Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- CPU -->
                <div class="glass-panel p-8 flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-slate-800/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative w-32 h-32 flex items-center justify-center mb-2">
                        <svg class="transform -rotate-90 w-32 h-32">
                            <circle cx="64" cy="64" r="36" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-800" />
                            <circle cx="64" cy="64" r="36" stroke="currentColor" stroke-width="8" fill="transparent"
                                    :stroke-dasharray="getDashArray(stats.sys_cpu_percent)"
                                    class="text-brand-500 transition-all duration-1000 ease-out" />
                        </svg>
                        <div class="absolute flex flex-col items-center justify-center">
                            <span class="text-3xl font-bold text-slate-100 font-mono" x-text="stats.sys_cpu_percent.toFixed(1)"></span>
                            <span class="text-xs text-brand-400 font-semibold">%</span>
                        </div>
                    </div>
                    <span class="text-sm font-medium text-slate-400">CPU 璐熻浇</span>
                </div>
                
                <!-- System Memory -->
                <div class="glass-panel p-8 flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-slate-800/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative w-32 h-32 flex items-center justify-center mb-2">
                        <svg class="transform -rotate-90 w-32 h-32">
                            <circle cx="64" cy="64" r="36" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-800" />
                            <circle cx="64" cy="64" r="36" stroke="currentColor" stroke-width="8" fill="transparent"
                                    :stroke-dasharray="getDashArray(stats.sys_mem_percent)"
                                    class="text-purple-500 transition-all duration-1000 ease-out" />
                        </svg>
                        <div class="absolute flex flex-col items-center justify-center">
                            <span class="text-3xl font-bold text-slate-100 font-mono" x-text="stats.sys_mem_percent.toFixed(1)"></span>
                            <span class="text-xs text-purple-400 font-semibold">%</span>
                        </div>
                    </div>
                    <span class="text-sm font-medium text-slate-400">绯荤粺鍐呭瓨</span>
                </div>
                
                <!-- WebUI Memory -->
                <div class="glass-panel p-8 flex flex-col justify-between relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-20 group-hover:opacity-100 transition-opacity text-emerald-500">
                        <i data-lucide="server" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-400 mb-1">WebUI 鐙珛杩涚▼</p>
                        <h3 class="text-3xl font-bold text-slate-100 font-mono tracking-tight flex items-baseline gap-1">
                            <span x-text="stats.webui_mem_mb.toFixed(1)"></span>
                            <span class="text-xs font-semibold text-emerald-400 uppercase">MB</span>
                        </h3>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-1.5 mt-6">
                        <!-- Pseudo bar just for aesthetics -->
                        <div class="bg-emerald-500 h-1.5 rounded-full" :style="`width: ${Math.min((stats.webui_mem_mb / 500) * 100, 100)}%`"></div>
                    </div>
                </div>
                
                <!-- Database Size -->
                <div class="glass-panel p-8 flex flex-col justify-between relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-4 opacity-20 group-hover:opacity-100 transition-opacity text-amber-500">
                        <i data-lucide="database" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-400 mb-1">鎸佷箙鍖栦綋绉?/p>
                        <h3 class="text-3xl font-bold text-slate-100 font-mono tracking-tight flex items-baseline gap-1">
                            <span x-text="(stats.db_size_kb / 1024).toFixed(2)"></span>
                            <span class="text-xs font-semibold text-amber-400 uppercase">MB</span>
                        </h3>
                    </div>
                    <p class="text-xs text-slate-500 mt-4">Astrmai 鏈湴 SQLite</p>
                </div>
            </div>

            <!-- Business Stats Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Users -->
                <div class="glass-panel p-8 flex items-center gap-6 group hover:border-brand-500/30 transition-colors">
                    <div class="w-12 h-12 rounded-lg bg-slate-800 border border-slate-700 text-brand-400 flex items-center justify-center transition-colors group-hover:bg-brand-500/10">
                        <i data-lucide="users-round" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-400 mb-1">鍏ㄥ眬瑙ｆ瀽鐢ㄦ埛</p>
                        <h4 class="text-3xl font-bold text-slate-100 font-mono" x-text="stats.total_users"></h4>
                    </div>
                </div>
                
                <!-- Pending Reviews -->
                <div class="glass-panel p-8 flex items-center gap-6 group hover:border-rose-500/30 transition-colors">
                    <div class="w-12 h-12 rounded-lg bg-slate-800 border border-slate-700 text-rose-400 flex items-center justify-center transition-colors group-hover:bg-rose-500/10">
                        <i data-lucide="shield-alert" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-400 mb-1">寰呬汉宸ュ鏍歌鍒?/p>
                        <h4 class="text-3xl font-bold text-slate-100 font-mono" x-text="stats.pending_reviews"></h4>
                    </div>
                </div>
                
                <!-- Memory Events -->
                <div class="glass-panel p-8 flex items-center gap-6 group hover:border-purple-500/30 transition-colors">
                    <div class="w-12 h-12 rounded-lg bg-slate-800 border border-slate-700 text-purple-400 flex items-center justify-center transition-colors group-hover:bg-purple-500/10">
                        <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-slate-400 mb-1">闀挎湡璁板繂鍗拌</p>
                        <h4 class="text-3xl font-bold text-slate-100 font-mono" x-text="stats.total_memory_events"></h4>
                    </div>
                </div>
            </div>

            <!-- Model Health Row -->
            <template x-if="models && models.data">
                <div class="glass-panel p-8">
                    <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                        <i data-lucide="network" class="w-5 h-5 text-brand-400"></i>
                        澶фā鍨嬪紩鎿庤繛鎺ョ姸鎬?                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="(modelData, engineName) in models.data" :key="engineName">
                            <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-4 flex justify-between items-center">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-sm font-semibold text-slate-200 capitalize" x-text="engineName + ' Engine'"></span>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider"
                                              :class="modelData.configured ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-400'"
                                              x-text="modelData.configured ? 'CONFIGURED' : 'UNSET'"></span>
                                    </div>
                                    <p class="text-xs text-slate-500 font-mono" x-text="modelData.provider || 'Provider not selected'"></p>
                                </div>
                                <div class="flex items-center gap-2" x-show="modelData.configured">
                                    <div class="w-2 h-2 rounded-full" :class="modelData.healthy ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-rose-500 shadow-[0_0_8px_#f43f5e]'"></div>
                                    <span class="text-xs font-semibold" :class="modelData.healthy ? 'text-emerald-500' : 'text-rose-500'" x-text="modelData.healthy ? 'Online' : 'Error'"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="capabilityEntries().length > 0">
                <div class="glass-panel p-8">
                    <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                        <i data-lucide="blocks" class="w-5 h-5 text-emerald-400"></i>
                        鑳藉姏鐭╅樀 (Capabilities)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="entry in capabilityEntries()" :key="entry.key">
                            <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-4">
                                <div class="text-sm font-semibold text-slate-200 mb-2" x-text="entry.key"></div>
                                <pre class="text-xs text-slate-400 whitespace-pre-wrap break-words max-h-32 overflow-auto" x-text="formatJson(entry.value)"></pre>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            
        </div>
    </div>

    <!-- HEARTFLOW TAB -->
        <div x-show="currentTab === 'heartflow'" x-cloak>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <template x-for="chat in heartflowChats" :key="chat.chat_id">
                <div class="glass-panel p-8">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i data-lucide="message-circle" class="w-5 h-5 text-rose-400"></i>
                                <span x-text="chat.chat_id"></span>
                            </h3>
                            <div class="flex flex-wrap gap-2 mt-2">
                                <template x-for="tag in chat.cooldown_tags || []">
                                    <span class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30" x-text="tag"></span>
                                </template>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button class="glass-btn px-3 py-1.5 text-xs hover:bg-slate-700/50" @click="openChatTraceDetails(chat.chat_id)">
                                <i data-lucide="list-tree" class="w-3.5 h-3.5"></i>杞ㄨ抗
                            </button>
                            <button class="glass-btn px-3 py-1.5 text-xs hover:bg-slate-700/50" @click="openHiddenContext(chat.chat_id)">
                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>鎺㈡煡娼滄剰璇?                            </button>
                            <button class="glass-btn px-3 py-1.5 text-xs hover:bg-slate-700/50" @click="clearCooldowns(chat.chat_id)">
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>閲嶇疆鍐峰嵈
                            </button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <!-- Interest -->
                        <div>
                            <div class="flex justify-between text-sm mb-1">
                                <span class="text-slate-400">鍏磋叮搴?(Interest)</span>
                                <span class="text-rose-400 font-bold" x-text="(chat.interest * 100).toFixed(0) + '%'"></span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-rose-500 h-2 rounded-full transition-all duration-500" :style="`width: ${chat.interest * 100}%`"></div>
                            </div>
                        </div>
                        <!-- Engagement -->
                        <div>
                            <div class="flex justify-between text-sm mb-1">
                                <span class="text-slate-400">鍙備笌搴?(Engagement)</span>
                                <span class="text-amber-400 font-bold" x-text="(chat.engagement * 100).toFixed(0) + '%'"></span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-amber-500 h-2 rounded-full transition-all duration-500" :style="`width: ${chat.engagement * 100}%`"></div>
                            </div>
                        </div>
                        <!-- Fatigue -->
                        <div>
                            <div class="flex justify-between text-sm mb-1">
                                <span class="text-slate-400">鐤插姵鍊?(Fatigue)</span>
                                <span class="text-purple-400 font-bold" x-text="(chat.fatigue * 100).toFixed(0) + '%'"></span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div class="bg-purple-500 h-2 rounded-full transition-all duration-500" :style="`width: ${chat.fatigue * 100}%`"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="heartflowChats.length === 0">
                <div class="col-span-full empty-state">
                    <i data-lucide="activity"></i>
                    <p>褰撳墠娌℃湁娲昏穬鐨勫績鏅烘祦鐘舵€?/p>
                </div>
            </template>
        </div>
    </div>

    <!-- COGNITION TAB -->
        <div x-show="currentTab === 'cognition'" x-cloak>
        <div class="flex flex-col gap-6">
            <div class="glass-panel p-8">
                <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">
                    <i data-lucide="radar" class="w-5 h-5 text-violet-400"></i>
                    Scheduler Diagnostics
                </h3>
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="text-sm font-bold uppercase tracking-wider text-slate-300">Scheduler Overview</h4>
                            <span class="status-badge status-badge-ai" x-text="schedulerStatus?.data?.scheduler_policy?.active_profile || 'balanced'"></span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div class="rounded-lg bg-slate-900/50 border border-slate-700/40 p-3">
                                <p class="text-xs text-slate-500 mb-1">Poll Mode</p>
                                <p class="font-mono text-white" x-text="schedulerOverview().scheduler_poll_mode || '-'"></p>
                            </div>
                            <div class="rounded-lg bg-slate-900/50 border border-slate-700/40 p-3">
                                <p class="text-xs text-slate-500 mb-1">Poll Interval</p>
                                <p class="font-mono text-white" x-text="schedulerOverview().scheduler_poll_interval ?? 0"></p>
                            </div>
                            <div class="rounded-lg bg-slate-900/50 border border-slate-700/40 p-3">
                                <p class="text-xs text-slate-500 mb-1">Due Chats</p>
                                <p class="font-mono text-white" x-text="schedulerOverview().due_chat_count ?? 0"></p>
                            </div>
                            <div class="rounded-lg bg-slate-900/50 border border-slate-700/40 p-3">
                                <p class="text-xs text-slate-500 mb-1">Forced Promotions</p>
                                <p class="font-mono text-white" x-text="schedulerOverview().forced_promotion_count ?? 0"></p>
                            </div>
                            <div class="rounded-lg bg-slate-900/50 border border-slate-700/40 p-3">
                                <p class="text-xs text-slate-500 mb-1">Maintenance Budget</p>
                                <p class="font-mono text-white" x-text="`${schedulerOverview().maintenance_budget_remaining ?? 0}/${schedulerOverview().maintenance_budget_total ?? 0}`"></p>
                            </div>
                            <div class="rounded-lg bg-slate-900/50 border border-slate-700/40 p-3">
                                <p class="text-xs text-slate-500 mb-1">Batch Fill</p>
                                <p class="font-mono text-white" x-text="formatPercent(schedulerOverview().batch_fill_rate)"></p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-5">
                        <h4 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-4">Batch / Backpressure</h4>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="status-badge" :class="schedulerStatus?.data?.proactive?.busy_backpressure_active ? 'status-badge-danger' : 'status-badge-success'">
                                busy_backpressure_active
                            </span>
                            <span class="status-badge" :class="schedulerStatus?.data?.proactive?.maintenance_backpressure_active ? 'status-badge-warning' : 'status-badge-success'">
                                maintenance_backpressure_active
                            </span>
                        </div>
                        <div class="space-y-3 text-sm">
                            <div>
                                <p class="text-xs text-slate-500 mb-1">scheduler_batch_plan</p>
                                <pre class="bg-slate-900/60 border border-slate-700/40 rounded-lg p-3 text-xs text-slate-300 overflow-auto max-h-44" x-text="formatJson(schedulerStatus?.data?.proactive?.scheduler_batch_plan || {})"></pre>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 mb-1">quota_skip_counts</p>
                                <pre class="bg-slate-900/60 border border-slate-700/40 rounded-lg p-3 text-xs text-slate-300 overflow-auto max-h-32" x-text="formatJson(schedulerStatus?.data?.proactive?.quota_skip_counts || {})"></pre>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 mb-1">poll_mode_transition</p>
                                <pre class="bg-slate-900/60 border border-slate-700/40 rounded-lg p-3 text-xs text-slate-300 overflow-auto max-h-32" x-text="formatJson(schedulerStatus?.data?.proactive?.poll_mode_transition || {})"></pre>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-5">
                        <h4 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-4">Chat Loop Drill-down</h4>
                        <div class="flex gap-2 mb-3">
                            <input
                                x-model="schedulerChatId"
                                type="text"
                                class="flex-1 bg-slate-900/60 border border-slate-700/60 rounded-lg px-3 py-2 text-sm text-slate-200"
                                placeholder="chat_id"
                            />
                            <button class="glass-btn px-3 py-2 text-xs" @click="loadSchedulerChatLoop()">Load</button>
                        </div>

                                <button class="icon-btn ml-auto">
                                    <i data-lucide="chevron-down" class="w-4 h-4 transition-transform" :class="expanded ? 'rotate-180' : ''"></i>
                                </button>
                            </div>
                            
                            <div x-show="expanded" x-cloak class="mt-3 border-t border-slate-700/50 pt-3">
                                <div class="flex justify-end mb-2">
                                    <button class="glass-btn px-3 py-1.5 text-xs" @click.stop="copyJson(call)">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> 澶嶅埗
                                    </button>
                                </div>
                                <div class="json-preview" x-text="formatJson(call)"></div>
                            </div>
                        </div>
                    </template>
                    <div x-show="chatToolCalls.length === 0" class="text-sm text-slate-500">鏆傛棤璇?chat 鐨勫伐鍏疯建杩广€?/div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Context Modal -->
    <div x-show="showHiddenContextModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#090A10]/60 backdrop-blur-[12px] p-4" x-cloak>
        <div class="glass-panel w-full max-w-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto" @click.away="showHiddenContextModal = false">
            <h3 class="text-xl font-bold text-slate-100 mb-2 flex items-center gap-2">
                <i data-lucide="eye" class="w-5 h-5 text-brand-400"></i>
                娼滄剰璇嗘。妗?(Hidden Context)
            </h3>
            <p class="text-xs text-slate-400 mb-6 font-mono" x-text="activeHiddenContextChat"></p>
            
            <div class="flex flex-col gap-4">
                <textarea class="w-full bg-slate-900 border border-white/10 rounded-lg p-4 text-sm text-brand-300 font-mono resize-none h-64 focus:outline-none" 
                          readonly x-text="activeHiddenContextStr"></textarea>
            </div>
            
            <div class="flex justify-end gap-3 mt-8">
                <button class="px-5 py-2 rounded-lg text-sm font-medium bg-brand-500 hover:bg-brand-600 text-white transition-colors" @click="showHiddenContextModal = false">鍏?闂?/button>
            </div>
        </div>
    </div>
</div>
