<div id="page-settings" x-show="currentPage === 'settings'" x-data="configPage()" x-cloak>
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-slate-100 mb-2">系统配置</h2>
            <p class="text-slate-400">管理 AstrMai 的核心运行参数与大模型绑定</p>
        </div>
        <div class="flex gap-3">
            <button class="glass-btn hover:bg-white/5 text-slate-300" @click="toggleAll">
                <i data-lucide="list" class="w-4 h-4"></i>
                <span x-text="expandAll ? '全部折叠' : '全部展开'"></span>
            </button>
            <button class="glass-btn glass-btn-primary" @click="applyConfig()" :disabled="applying || !meta.pending_apply">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span x-text="applying ? '应用中...' : (meta.pending_apply ? '应用更改' : '已是最新')"></span>
            </button>
        </div>
    </div>

    <!-- Meta Status Panel -->
    <div x-show="meta.config_exists" class="glass-panel p-4 mb-8 flex items-center justify-between border-l-4" :class="meta.pending_apply ? 'border-l-amber-500 bg-amber-500/5' : 'border-l-emerald-500 bg-emerald-500/5'">
        <div class="flex items-center gap-3">
            <div class="p-2 rounded-full" :class="meta.pending_apply ? 'bg-amber-500/20 text-amber-500' : 'bg-emerald-500/20 text-emerald-500'">
                <i data-lucide="info" class="w-5 h-5" x-show="!meta.pending_apply"></i>
                <i data-lucide="alert-triangle" class="w-5 h-5" x-show="meta.pending_apply"></i>
            </div>
            <div>
                <p class="text-white font-medium" x-text="meta.pending_apply ? '有未应用的更改' : '配置已生效'"></p>
                <p class="text-sm text-slate-400 mt-0.5">
                    最后应用时间: <span x-text="meta.apply_status?.applied_at ? new Date(meta.apply_status.applied_at * 1000).toLocaleString() : '未知'"></span>
                </p>
            </div>
        </div>
        <div x-show="meta.apply_status?.reload_required" class="px-3 py-1 bg-rose-500/20 text-rose-400 rounded-full text-xs font-semibold border border-rose-500/30">
            需要重启
        </div>
    </div>

    <div x-show="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-4 text-brand-500"></i>
        <p>正在读取核心架构参数...</p>
    </div>

    <div x-show="!loading" class="flex flex-col gap-6 pb-20">
        <template x-for="section in sections" :key="section.key">
            <div class="glass-panel overflow-hidden transition-all duration-300 shadow-lg border border-white/10" :class="section.open ? 'ring-1 ring-brand-500/30' : 'hover:border-white/20'">
                <!-- Section Header -->
                <div class="flex justify-between items-center p-5 cursor-pointer bg-slate-800/30 hover:bg-slate-700/30 transition-colors" @click="section.open = !section.open">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-brand-500/10 rounded-lg text-brand-400">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-slate-100" x-text="section.title"></h3>
                    </div>
                    <div class="text-slate-400 transition-transform duration-300" :class="section.open ? 'rotate-180' : ''">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>
                
                <!-- Section Body -->
                <div x-show="section.open">
                    <div class="p-8 border-t border-white/5 bg-slate-900/40">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <template x-for="(fieldDef, fieldKey) in sectionFields(section)" :key="fieldKey">
                                <div class="flex flex-col">
                                    <div class="flex justify-between items-end mb-2">
                                        <div class="flex items-center gap-2">
                                            <label class="font-medium text-slate-200" x-text="fieldKey"></label>
                                            <template x-if="['provider', 'vision', 'sys3'].includes(section.key) || ['webui_password', 'embedding_models'].includes(fieldKey)">
                                                <span class="status-badge status-badge-warning" title="修改此项可能需要重启">需要重载</span>
                                            </template>
                                        </div>
                                        <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-slate-800 text-slate-400" x-text="fieldDef.type"></span>
                                    </div>
                                    <p class="text-sm text-slate-400 mb-3" x-show="fieldDef.hint" x-text="fieldDef.hint"></p>
                                    
                                    <!-- String / Int -->
                                    <template x-if="fieldDef.type === 'string' || fieldDef.type === 'int'">
                                        <input :type="fieldDef.type === 'int' ? 'number' : 'text'" 
                                               class="glass-input" 
                                               :placeholder="fieldDef.default !== undefined ? String(fieldDef.default) : ''"
                                               :value="getValue(section.key, fieldKey)" 
                                               @input="setValue(section.key, fieldKey, fieldDef.type === 'int' ? parseInt($event.target.value) : $event.target.value)">
                                    </template>
                                    
                                    <!-- Float -->
                                    <template x-if="fieldDef.type === 'float'">
                                        <div class="flex gap-4 items-center bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                                            <input type="range" class="flex-1 accent-brand-500" step="0.1" max="2.0" min="0.0" 
                                                   :value="getValue(section.key, fieldKey)" 
                                                   @input="setValue(section.key, fieldKey, parseFloat($event.target.value))">
                                            <input type="number" class="glass-input w-24 text-center px-2" step="0.1" 
                                                   :value="getValue(section.key, fieldKey)" 
                                                   @input="setValue(section.key, fieldKey, parseFloat($event.target.value))">
                                        </div>
                                    </template>
                                    
                                    <!-- Bool -->
                                    <template x-if="fieldDef.type === 'bool'">
                                        <label class="flex items-center gap-3 cursor-pointer p-3 rounded-lg border border-slate-700/50 bg-slate-800/50 hover:bg-slate-700/50 transition-colors">
                                            <div class="relative">
                                                <input type="checkbox" class="sr-only peer" :checked="getValue(section.key, fieldKey)" @change="setValue(section.key, fieldKey, $event.target.checked)">
                                                <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                                            </div>
                                            <span class="text-sm font-medium text-slate-300">启用</span>
                                        </label>
                                    </template>
                                    
                                    <!-- List -->
                                    <template x-if="fieldDef.type === 'list'">
                                        <div class="flex flex-col gap-3">
                                            <div class="flex flex-wrap gap-2 mb-1">
                                                <template x-for="(item, idx) in getValue(section.key, fieldKey) || []">
                                                    <div class="bg-brand-500/20 border border-brand-500/30 text-brand-300 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 group">
                                                        <span x-text="item"></span>
                                                        <button class="text-brand-500/50 hover:text-rose-400 transition-colors" @click="removeFromList(section.key, fieldKey, idx)">
                                                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                                        </button>
                                                    </div>
                                                </template>
                                                <template x-if="(getValue(section.key, fieldKey) || []).length === 0">
                                                    <span class="text-sm text-slate-500 italic py-1.5">暂无数据</span>
                                                </template>
                                            </div>
                                            <div class="relative">
                                                <input type="text" class="glass-input pr-10" placeholder="输入内容后回车添加" @keydown.enter.prevent="addToList(section.key, fieldKey, $event)">
                                                <i data-lucide="corner-down-left" class="absolute right-3 top-3.5 w-4 h-4 text-slate-500 pointer-events-none"></i>
                                            </div>
                                        </div>
                                    </template>
                                    
                                    <!-- JSON Textarea -->
                                    <template x-if="['object', 'dict', 'template_list'].includes(fieldDef.type)">
                                        <div class="relative" x-data="{ localVal: formatJsonValue(getValue(section.key, fieldKey)), parseError: false }">
                                            <textarea class="glass-input font-mono text-xs min-h-[160px] resize-y" 
                                                      :class="parseError ? 'border-rose-500/50 focus:border-rose-500/50 focus:ring-rose-500/50' : ''"
                                                      x-model="localVal"
                                                      @input="parseError = !tryParseAndSet(section.key, fieldKey, localVal)"></textarea>
                                            <p x-show="parseError" class="text-xs text-rose-400 mt-1 flex items-center gap-1">
                                                <i data-lucide="alert-circle" class="w-3 h-3"></i> JSON 格式错误，当前输入不会被保存
                                            </p>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        
                        <!-- Section Actions -->
                        <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-white/5">
                            <button class="glass-btn hover:bg-rose-500/10 text-slate-300 hover:text-rose-400" @click="resetSection(section.key)">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                <span>恢复默认</span>
                            </button>
                            <button class="glass-btn bg-slate-700 hover:bg-slate-600 text-white" @click="saveSection(section.key)">
                                <i data-lucide="check" class="w-4 h-4"></i>
                                <span>保存此项</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <section class="glass-panel p-8 border border-amber-500/20">
            <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-6">
                <div>
                    <h3 class="text-lg font-semibold text-slate-100 flex items-center gap-2">
                        <i data-lucide="shield-alert" class="w-5 h-5 text-amber-400"></i>
                        高级配置操作
                    </h3>
                    <p class="text-sm text-slate-400 mt-2">这些操作会影响整个 config.json，建议只在确认配置结构正确时使用。</p>
                    <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-slate-400">
                        <div class="bg-slate-900/50 rounded-lg p-3 border border-white/5">
                            <div class="text-slate-500 mb-1">config_path</div>
                            <div class="font-mono break-all" x-text="meta.config_path || '-'"></div>
                        </div>
                        <div class="bg-slate-900/50 rounded-lg p-3 border border-white/5">
                            <div class="text-slate-500 mb-1">schema_path</div>
                            <div class="font-mono break-all" x-text="meta.schema_path || '-'"></div>
                        </div>
                        <div class="bg-slate-900/50 rounded-lg p-3 border border-white/5">
                            <div class="text-slate-500 mb-1">config_mtime</div>
                            <div class="font-mono" x-text="formatMetaTime(meta.config_mtime)"></div>
                        </div>
                        <div class="bg-slate-900/50 rounded-lg p-3 border border-white/5">
                            <div class="text-slate-500 mb-1">schema_mtime</div>
                            <div class="font-mono" x-text="formatMetaTime(meta.schema_mtime)"></div>
                        </div>
                    </div>
                    <div class="mt-4 text-xs text-slate-400">
                        pending_apply:
                        <span class="font-semibold" :class="meta.pending_apply ? 'text-amber-400' : 'text-emerald-400'" x-text="meta.pending_apply ? 'true' : 'false'"></span>
                        <span class="mx-2 text-slate-600">|</span>
                        apply_status:
                        <span class="font-mono" x-text="meta.apply_status?.status || 'unknown'"></span>
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row lg:flex-col gap-3 min-w-[220px]">
                    <button class="glass-btn bg-slate-700 hover:bg-slate-600 text-white justify-center" @click="saveAllConfig()" :disabled="advancedBusy">
                        <i data-lucide="save-all" class="w-4 h-4"></i>
                        <span>保存全部配置</span>
                    </button>
                    <button class="glass-btn hover:bg-white/5 text-slate-300 justify-center" @click="openRawConfig()" :disabled="advancedBusy">
                        <i data-lucide="file-json" class="w-4 h-4"></i>
                        <span>查看原始配置</span>
                    </button>
                    <button class="glass-btn hover:bg-rose-500/10 text-rose-300 hover:text-rose-200 justify-center" @click="resetAllConfig()" :disabled="advancedBusy">
                        <i data-lucide="triangle-alert" class="w-4 h-4"></i>
                        <span>重置全部配置</span>
                    </button>
                </div>
            </div>
        </section>
    </div>

    <div x-show="showRawConfigModal" class="fixed inset-0 z-50 flex items-center justify-center bg-[#090A10]/60 backdrop-blur-[12px] p-4" x-cloak>
        <div class="glass-panel w-full max-w-4xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto flex flex-col" @click.away="showRawConfigModal = false">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h3 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                        <i data-lucide="file-json" class="w-5 h-5 text-brand-400"></i>
                        原始配置 JSON
                    </h3>
                    <p class="text-xs text-slate-400 mt-1">只读预览，编辑请回到配置表单。</p>
                </div>
                <button class="glass-btn px-3 py-1.5 text-xs" @click="showRawConfigModal = false">关闭</button>
            </div>
            <textarea class="w-full flex-1 bg-slate-900/80 border border-slate-700/50 rounded-lg p-4 text-sm text-brand-300 font-mono resize-none min-h-[400px] focus:outline-none cursor-not-allowed" readonly x-text="rawConfigText"></textarea>
        </div>
    </div>
</div>
