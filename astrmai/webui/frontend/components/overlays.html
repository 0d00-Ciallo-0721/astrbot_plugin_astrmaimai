<!-- Global Toast Container -->
<div class="fixed top-6 right-6 z-[100] flex flex-col gap-3">
    <template x-for="toast in toasts" :key="toast.id">
        <div class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 min-w-[280px] flex items-center gap-3 transform transition-all duration-300 shadow-lg"
             :class="[
                 toast.show ? 'translate-x-0 opacity-100' : 'translate-x-[120%] opacity-0',
                 toast.type === 'success' ? 'border-l-2 border-l-emerald-500' : 
                 toast.type === 'error' ? 'border-l-2 border-l-rose-500' : 
                 'border-l-2 border-l-brand-500'
             ]">
            <template x-if="toast.type === 'success'">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i>
            </template>
            <template x-if="toast.type === 'error'">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500"></i>
            </template>
            <template x-if="toast.type === 'info'">
                <i data-lucide="info" class="w-4 h-4 text-brand-500"></i>
            </template>
            <span class="text-sm font-medium text-slate-200" x-text="toast.message"></span>
        </div>
    </template>
</div>

<!-- Global Modal Container -->
<div class="fixed inset-0 bg-[#090A10]/60 backdrop-blur-[12px] z-50 flex items-center justify-center transition-all duration-300"
     :class="modal.open ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'"
     @click.self="closeModal">
    <div class="glass-panel p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl transition-all duration-300 transform"
         :class="modal.open ? 'scale-100 translate-y-0' : 'scale-95 translate-y-4'">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-semibold text-slate-100 tracking-tight" x-text="modal.title"></h3>
            <button @click="closeModal" class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/10">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div x-html="modal.content" class="text-slate-300"></div>
    </div>
</div>

<!-- Global Confirm Container -->
<div class="fixed inset-0 bg-[#090A10]/60 backdrop-blur-[12px] z-[60] flex items-center justify-center transition-all duration-300"
     :class="confirm.open ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'">
    <div class="glass-panel p-6 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl transition-all duration-300 transform"
         :class="confirm.open ? 'scale-100 translate-y-0' : 'scale-95 translate-y-4'">
        <div class="flex items-center gap-3 mb-4">
            <div class="p-2 rounded-full" :class="confirm.type === 'danger' ? 'bg-rose-500/20 text-rose-500' : 'bg-brand-500/20 text-brand-500'">
                <i data-lucide="help-circle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-xl font-semibold text-slate-100 tracking-tight" x-text="confirm.title"></h3>
        </div>
        <p class="text-slate-300 mb-8 ml-11" x-text="confirm.message"></p>
        <div class="flex justify-end gap-3">
            <button class="glass-btn hover:bg-slate-700 text-slate-300 border border-slate-600" @click="confirm.onCancel && confirm.onCancel()">取消</button>
            <button class="glass-btn" 
                    :class="confirm.type === 'danger' ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-lg' : 'glass-btn-primary'" 
                    @click="confirm.onConfirm && confirm.onConfirm()" 
                    x-text="confirm.confirmText || (confirm.type === 'danger' ? '确认删除' : '确认')"></button>
        </div>
    </div>
</div>
