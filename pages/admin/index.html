<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AstrMai Admin</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="admin-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AstrBot Plugin Page</p>
        <h1>AstrMai 管理台</h1>
      </div>
      <div class="topbar-actions">
        <span id="bridge-status" class="status-pill">Bridge 初始化中</span>
        <button id="refresh-button" class="ghost-button" type="button">刷新当前页</button>
      </div>
    </header>

    <nav id="tabs" class="tabs" aria-label="AstrMai 管理导航"></nav>

    <main id="content" class="content">
      <section class="empty-state">
        <h2>正在连接 AstrBot 页面桥接</h2>
        <p>如果长时间停留在这里，请确认页面是从 AstrBot 插件详情页打开的。</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root" class="modal-root" hidden></div>
  </div>

  <script defer src="./app.js"></script>
</body>
</html>
